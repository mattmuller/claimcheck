name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag equals the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version v$version." >&2
            exit 1
          fi
      - name: Use npm 11.5.1 or newer (trusted publishing needs it)
        run: |
          current="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n1)" != "11.5.1" ]; then
            npm install -g npm@11.5.1
          fi
          npm --version
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          node scripts/changelog-section.mjs "$version" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
